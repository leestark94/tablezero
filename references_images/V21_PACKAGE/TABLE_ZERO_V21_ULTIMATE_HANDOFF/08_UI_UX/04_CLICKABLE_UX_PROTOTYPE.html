<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABLE//ZERO — V21 UX Flow Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0b0e12;--panel:#151a20;--panel2:#1c232c;--ink:#ece4d5;--dim:#a2aab2;--paper:#e7ddc9;--paperink:#20282b;--line:#39434c;--accent:#bb9873;--a2:#8da8bb;--warn:#c7a47b;--good:#83a39b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 20%,#25303a 0%,#131920 30%,#080b0e 76%);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--ink);background:#1d252d;border:1px solid #53606b;border-radius:5px;padding:11px 15px;transition:.15s}button:hover{border-color:var(--accent);background:#2b3238}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--accent);color:#171b1d;border-color:var(--accent);font-weight:700}button.primary:hover{background:#d1b08c}button.ghost{background:transparent;border-color:#36414a}.shell{max-width:1540px;min-height:90vh;margin:auto;padding:27px 35px}.micro{font-size:11px;color:var(--dim);letter-spacing:1.7px}.banner{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:20px}.brand{font-size:27px;font-weight:800;letter-spacing:2px}.brand span{color:var(--accent)}.pill{display:inline-block;border:1px solid #5a534a;color:#cbb89f;border-radius:3px;padding:3px 8px;font-size:10px;letter-spacing:1px}.hud{font-size:12px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}.hud strong{font-size:17px;color:#f6dfb8}.panel{background:rgba(23,29,36,.93);border:1px solid #3d464f;border-radius:7px;padding:22px}.paper{color:var(--paperink);background:linear-gradient(130deg,#f0e7d6,#d9cdb9);box-shadow:2px 9px 25px #0007}.paper .muted{color:#626460}.muted{color:var(--dim)}h1{font-size:35px;line-height:1.2;margin:0 0 22px}h2{font-size:22px;margin:0 0 14px}h3{font-size:17px;margin:0 0 12px}p{margin:8px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.btnrow{display:flex;flex-wrap:wrap;gap:9px}.btncol{display:flex;flex-direction:column;gap:10px}.divider{height:1px;background:#48535d6f;margin:18px 0}.stage{min-height:590px;display:flex;flex-direction:column;justify-content:center}.screen-intro{max-width:450px}.slab{height:440px;background:linear-gradient(30deg,#08090a,#151a20 25%,#222933 53%,#090d11);border:1px solid #37414b;border-radius:6px;position:relative;overflow:hidden}.slab:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080b0e 5%,transparent 45%)}.door{position:absolute;top:30px;right:13%;width:32%;height:96%;background:linear-gradient(90deg,#13171b,#343536 50%,#15171b);border:6px solid #353c40;box-shadow:0 0 35px #d9cba51f}.door::after{content:'302';position:absolute;top:23%;left:36%;letter-spacing:6px;color:#b7a990}.case{display:grid;grid-template-columns:220px minmax(0,1fr);gap:25px}.portrait{height:240px;border:1px solid #797875;background:linear-gradient(135deg,#777e7b,#343b40);display:flex;align-items:center;justify-content:center;color:#d7dbd2;position:relative}.portrait:after{content:'정수연 · 신원사진 자리';font-size:12px;background:#171f24bb;padding:8px;position:absolute;bottom:10px}.lineitem{border-bottom:1px solid #5c605f39;padding:8px 0;display:flex;gap:12px}.lineitem b{min-width:86px}.sceneview{height:430px;border:1px solid #505b65;background:radial-gradient(ellipse at 55% 70%,#60594d88,#1b2228 46%,#080b0e 95%);border-radius:7px;position:relative;overflow:hidden}.room-wall{position:absolute;width:80%;height:45%;top:0;left:10%;background:linear-gradient(115deg,#40403c,#292c2c);box-shadow:0 5px 20px #080a0b}.floor{position:absolute;bottom:0;height:45%;width:100%;background:linear-gradient(#463e34,#161719)}.obj{position:absolute;border-radius:5px;background:#d9c8a5d9;border:2px solid #a28f77;box-shadow:2px 8px 25px #0008}.obj.table{bottom:25%;left:45%;width:27%;height:16%;transform:skew(-12deg)}.obj.phone{bottom:23%;left:30%;width:4%;height:9%;background:#182129}.obj.documents{bottom:33%;left:48%;width:13%;height:8%;background:#ece2d1;transform:rotate(-13deg)}.obj.photo{top:28%;right:25%;width:15%;height:17%;border:5px solid #78654d;background:#878078;transform:rotate(8deg)}.obj.medical{bottom:16%;right:17%;width:12%;height:5%;background:#c9cfce}.objectlabel{position:absolute;bottom:18px;left:20px;font-size:12px;color:#cfd3d7;background:#111c25d4;padding:7px 11px}.hotspots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.hotspots button{text-align:left;font-size:13px}.hq{display:grid;grid-template-columns:25% 47% 28%;gap:12px}.hq>*{min-width:0}.timeline{padding:12px 5px}.line-row{padding:12px 14px;border-left:2px solid var(--accent);margin:10px 0 10px 12px;background:#151d23}.line-row strong{color:#c7b090}.int{display:grid;grid-template-columns:25% minmax(0,1fr) 21%;gap:10px;min-height:580px}.int>*{min-width:0}.dossier{padding:23px}.dossier h2{font-size:21px}.actor{border:1px solid #36434a;border-radius:7px;background:radial-gradient(ellipse at 50% 30%,#444343 0%,#252a2e 31%,#12161b 72%);position:relative;overflow:hidden;min-height:520px}.actor .light{position:absolute;top:0;width:100%;height:180px;background:radial-gradient(ellipse at 55% 0%,#a9a39a45,transparent 72%)}.silhouette{position:absolute;bottom:-5%;left:22%;width:56%;height:75%;background:linear-gradient(160deg,#45484d,#242426 55%,#111519);border-radius:44% 44% 12% 12%;box-shadow:0 0 35px #000}.face{position:absolute;bottom:41%;left:36%;width:28%;height:30%;border-radius:49% 49% 44% 44%;background:linear-gradient(155deg,#87766b,#473e3c 55%,#202021);box-shadow:0 -20px 14px #17191b}.acting-caption{position:absolute;bottom:20px;left:18px;right:18px;text-align:center;font-size:12px;color:#aab5bc}.chat{margin-top:10px;padding:14px;background:#10151a;border:1px solid #3b474f;border-radius:6px}.chatline{padding:9px 12px;border-bottom:1px solid #303943}.chatline b{color:#d5b696}.chatbar{display:flex;gap:8px}.chatbar textarea{background:#0c1115;border:1px solid #56606a;color:var(--ink);padding:11px;border-radius:4px;min-height:60px;resize:vertical;flex:1;width:100%}.item{padding:10px 12px;background:#202832;border:1px solid #39434e;border-radius:4px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:9px}.badge{font-size:11px;color:#d7bb9b;padding:2px 7px;border:1px solid #77634b;border-radius:3px}.proof{display:grid;grid-template-columns:25% 1fr 28%;gap:14px}.proofrow{padding:14px;margin-bottom:10px;border:1px solid #596068;background:#1d262d}.proofrow h3{margin:0 0 9px}.toast{position:fixed;bottom:20px;right:20px;background:#27323a;border:1px solid #8da9b0;color:#eee;padding:13px 18px;max-width:400px;box-shadow:0 4px 24px #0009;z-index:9;border-radius:7px}.notice{padding:9px 12px;border:1px solid #6b5b43;background:#30291e;color:#e0c8a4;font-size:12px;border-radius:4px;margin:8px 0}.foot{font-size:11px;letter-spacing:.2px;color:#7e8b98;margin-top:22px}.stack{display:flex;flex-direction:column;gap:12px}select,input[type=text]{background:#0d1216;border:1px solid #53606b;color:var(--ink);border-radius:4px;padding:11px;width:100%}label{display:block;margin:12px 0}.spaced{display:flex;justify-content:space-between;align-items:center;gap:20px}@media(max-width:1050px){.shell{padding:16px}.int{grid-template-columns:1fr}.actor{min-height:300px}.dossier{display:block}.hq,.proof{grid-template-columns:1fr}.case{grid-template-columns:1fr}.three,.grid{grid-template-columns:1fr}.hotspots{grid-template-columns:1fr 1fr}.stage{min-height:auto}.slab{height:280px}}
</style></head><body><div class="shell"><div class="banner"><div class="brand">TABLE<span>//</span>ZERO <span class="pill">V21 UX PROTOTYPE</span></div><div class="hud"><span id="clock"></span><span>수사 예산 <strong id="budget">180</strong>분</span><button class="ghost" id="toMenu">메뉴</button></div></div><main id="app"></main><div class="foot">이 문서는 HTML로 동작하는 인터랙티브 UX 시안입니다. 실제 Unity 3D, AI 용의자, 음성 인식, 감식 판정, 범인 판정과는 연결되지 않습니다. 사건 사실은 V21 바이블을 참조해야 합니다.</div></div><div id="toasts"></div>
<script>
const state={screen:'menu',budget:180,seen:new Set(),photos:new Set(),claimed:new Set(),suspect:'강도현',messages:[],questionCount:0,tactic:'normal',report:'',interviews:new Set(),forensic:new Set(),note:''};
const A=document.querySelector('#app');const B=document.querySelector('#budget');const clock=document.querySelector('#clock');
const facts=[['정산서','LV-021','문서 묶음의 내용과 손글씨 수정 흔적을 관찰합니다.'],['피해자 휴대전화','LV-027','액정이 파손된 전화기입니다. 내부 기록은 별도 포렌식이 필요합니다.'],['깨진 사진 액자','LV-029','네 사람이 함께 찍은 오래된 사진입니다. 유리 조각이 주변에 있습니다.'],['좌식 탁자','LV-040','탁자 모서리 부근에 붉은 흔적이 있습니다. 정확한 원인은 감식 전 불명확합니다.'],['구급 흔적','LV-041','구조 과정에서 남은 물품과 이동 흔적이 보입니다.'],['도현의 짐 상자','EN-016','남성 이름이 적힌 상자입니다. 내용물과 최근 사용 여부는 별도 확인이 필요합니다.'],['배송 봉투','LV-022','내용을 확인하지 않은 봉투가 놓여 있습니다. 앞면과 뒷면을 살펴볼 수 있습니다.'],['배달 영수증','LV-037','20:47 배달 완료 시각이 인쇄되어 있습니다.']];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function message(s){let el=document.createElement('div');el.className='toast';el.textContent=s;document.querySelector('#toasts').append(el);setTimeout(()=>el.remove(),3500);}
function spend(cost,why){if(state.budget<cost){message('수사분이 부족합니다. 수첩 검토 또는 보고서 제출은 가능합니다.');return false;}if(!confirm(`${why}\n수사 예산 ${cost}분을 차감할까요?`))return false;state.budget-=cost;B.textContent=state.budget;return true;}
function go(s){state.screen=s;render();scrollTo(0,0);}
function btn(label,action,variant=''){return `<button class="${variant}" data-act="${action}">${label}</button>`;}
function top(name){return `<div class="micro">CASE 001 / ${name}  ·  UI/UX DEMO</div><div class="divider"></div>`;}
function menu(){return `<section class="grid stage"><div class="screen-intro"><div class="micro">국내 범죄 수사 심리전 · 데모 화면 흐름</div><h1 style="font-size:54px;margin-top:18px">진술은 남는다.<br>진실은 숨는다.</h1><p class="muted">세 사람의 진술이 서로 충돌할 때, 형사는 수사 시간을 어디에 써야 할까?</p><div class="btncol" style="max-width:250px;margin-top:24px">${btn('새 사건','case','primary')}${btn('이어하기 · 데모','hub')}${btn('사건 기록','archive')}${btn('설정','settings')}${btn('종료 · 화면 시안','quit')}</div></div><div class="slab"><div class="door"></div><div style="position:absolute;bottom:22px;right:30px;color:#c3bca7;z-index:2;font-size:12px">경기도 소재 다세대주택 302호 / 00:10</div></div></section>`;}
function caseSelect(){return `${top('사건 선택')}<h1>사건을 선택하십시오</h1><div class="grid"><div class="panel"><div class="micro">CASE 001 / 플레이 가능 시나리오</div><h2>302호의 밤</h2><p class="muted">여성 사망 사건 · 한국형 3D 현장 조사와 AI 자유 심문</p>${btn('사건 배정 받기','brief','primary')}</div><div class="panel"><div class="micro">CASE 002</div><h2>다음 사건</h2><p class="muted">공통 AI 엔진 재사용 대상 — 실제 사건 데이터/콘텐츠 미구현</p><button disabled>제작 준비 중</button></div></div>`;}
function briefing(){return `${top('초동 사건 배정 · 확인된 정보만')}<h1>302호의 밤</h1><div class="panel paper case"><div class="portrait"></div><div><div class="micro muted">사건 배정 기록 / CASE 001</div><h2>정수연 · 29세</h2><div class="lineitem"><b>직업</b><span>화장품 회사 직원</span></div><div class="lineitem"><b>주소</b><span>경기도 소재 다세대주택 302호</span></div><div class="lineitem"><b>신고</b><span>2026년 10월 15일 22:07, 301호 거주자 신고</span></div><div class="lineitem"><b>조치</b><span>의식 없는 상태로 발견 → 119 이송 → 병원 사망 확인</span></div><div class="lineitem"><b>경위</b><span>부상 발생 과정 및 정확한 시각 조사 중</span></div><p style="font-size:13px;margin-top:17px"><b>수사 지시:</b> 현장을 확인하고 사망에 이른 경위를 조사하라. 현재 확인된 정보만 기재함.</p></div></div><div class="btnrow" style="margin-top:20px">${btn('시네마틱 설명 보기','cinematic')}${btn('302호 출동','scene','primary')}${btn('뒤로','case')}</div>`;}
function cinematic(){return `${top('사건 배정 시네마틱 · 장면 프리뷰')}<div class="panel" style="padding:50px;min-height:390px;display:grid;align-content:center;text-align:center"><div class="micro">22:07 / 112 신고 접수</div><h1 style="margin-top:20px">“302호에 사람이 쓰러져 있어요.”</h1><p class="muted">전화 진동 → 사건 파일 전달 → 병원 사망 확인 → 302호 통제선 앞 형사</p><div class="btnrow" style="justify-content:center;margin-top:25px">${btn('브리핑 페이지로','brief','primary')}${btn('시네마틱 건너뛰기','brief')}</div></div>`;}
function scene(){return `${top('302호 첫 현장 · 피해자는 이송됨')}<div class="hud" style="margin-bottom:13px"><span>현장 관찰 무료</span><span>증거 사진 1분</span><span>봉인·채취 3분</span></div><div class="sceneview"><div class="room-wall"></div><div class="floor"></div><div class="obj table"></div><div class="obj phone"></div><div class="obj documents"></div><div class="obj photo"></div><div class="obj medical"></div><div class="objectlabel">3D 제작 전 화면 배치 시안 · 시신 없음 · 사건 내용은 스포일러 금지</div></div><div class="hotspots">${facts.map((f,i)=>btn(`관찰: ${f[0]} ${state.seen.has(f[1])?'✓':''}`,'inspect:'+i)).join('')}</div><div class="btnrow" style="margin-top:17px">${btn('수사본부 복귀','hubfromscene','primary')}${btn('사건 수첩','board')}</div>`;}
function hub(){return `${top('수사본부 / 사건 통제 책상')}<div class="hq"><div class="panel"><h3>수사 기록</h3><p class="muted">관찰 지점 ${state.seen.size}개<br>사진 기록 ${state.photos.size}개<br>심문한 인물 ${state.interviews.size}명<br>의뢰 ${state.forensic.size}건</p>${btn('사건 수첩 · 시간표','board')}</div><div class="panel"><h3>확인된 사건의 순서</h3><div class="timeline"><div class="line-row"><strong>20:47</strong> 배달 영수증 확인 가능</div><div class="line-row"><strong>22:07</strong> 301호 주민 신고 접수</div><div class="line-row"><strong>이후</strong> 병원 이송·사망 확인</div><div class="muted" style="padding:12px">그 사이에 무슨 일이 있었는지는 증거·진술을 통해 확보해야 합니다.</div></div></div><div class="panel btncol"><h3>수사 행동</h3>${btn('용의자 호출 · 6분','roster','primary')}${btn('포렌식 의뢰','forensic')}${btn('기록 요청','records')}${btn('현장 재방문 · 5분','revisit')}${btn('최종보고서 초안','report')}</div></div>`;}
function roster(){return `${top('용의자 목록')}<h1>누구부터 조사할 것인가</h1><div class="three">${[['강도현','전 남자친구','물류설비 업체 근무'],['이서연','친구·동업자','화장품 회사 근무'],['박현수','301호 이웃','배송 계약 업무']].map(([name,role,job])=>`<div class="panel"><div class="micro">조사 대상 기록</div><h2>${name}</h2><p class="muted">${role}<br>${job}</p>${btn('조사실 호출 · 6분','call:'+name,'primary')}</div>`).join('')}</div><div style="margin-top:15px">${btn('수사본부로','hub')}</div>`;}
function interrogation(){let who=esc(state.suspect);return `${top('진술녹화실 2 · 자유 심문')}<div class="int"><div class="paper dossier"><div class="micro muted">조사 대상 기록</div><h2 style="margin-top:17px">${who}</h2><p class="muted">대상자의 신원과 공개된 진술만 표시</p><div class="divider" style="background:#9e998f"></div><p><b>현재 세션:</b> 진행 중</p><p><b>현재 질문:</b> ${state.questionCount}회</p><p><b>사건 증거:</b> ${state.photos.size}건 사진</p><p style="font-size:12px">인물이 실제로 모르는 사건 사실을 플레이어 UI가 누설하지 않도록 별도 사건 데이터와 분리하십시오.</p></div><div class="actor"><div class="light"></div><div class="silhouette"></div><div class="face"></div><div class="acting-caption">실제 3D 배우·리깅 자리 / 여기의 도형은 배치 시안</div></div><div class="panel btncol"><div class="micro">전술 / 수사분</div>${[['기본 질문','normal','2'],['증거 제시','evidence','3'],['의도적 침묵','silence','4'],['심리적 압박','pressure','6'],['책상 내려치기','desk','12']].map(([n,t,c])=>`<button data-act="tactic:${t}" style="${state.tactic===t?'border-color:var(--accent);background:#4d4034':''}">${n} · ${c}분</button>`).join('')}${btn('면담 마치기','hub')}</div></div><div class="chat"><div class="micro">진술원문 — 이 응답은 UI 확인용 예시이며 실제 AI가 아닙니다</div>${state.messages.slice(-3).map(m=>`<div class="chatline"><b>${esc(m.by)}:</b> ${esc(m.text)}</div>`).join('')}<div class="chatbar" style="margin-top:11px"><button data-act="mic" title="마이크 입력 UX 시안">🎙️<span style="font-size:11px;display:block">V 말하기</span></button><textarea id="question" placeholder="직접 질문을 입력하세요. 이 시안에서는 실제 AI에 연결되지 않습니다."></textarea><button class="primary" data-act="ask">전송</button></div><div class="muted" style="font-size:11px;margin-top:8px">선택 전술 ${state.tactic} · STT/AI 처리 오류 시 실제 게임에서는 차감 0 · 본 시안은 더미 응답만 출력</div></div>`;}
function forensic(){return `${top('포렌식 접수 / 진짜 검사 결과는 연결되지 않은 UI 시안')}<h1>어떤 사실을 확인할 것인가?</h1><div class="grid"><div class="panel"><h3>검사 후보</h3>${[['휴대전화 원본 분석','phone'],['탁자·현장 혈흔 재구성','impact'],['서류 파편 대조','paper'],['의복·접촉 흔적','cloth']].map(([n,id])=>`<div class="item">${n} ${btn('의뢰 12분','lab:'+id)}</div>`).join('')}</div><div class="panel"><h3>접수 상태</h3><p class="muted">신청 전 반드시 출처·봉인·절차·검사 한계를 보여 줍니다.</p>${[...state.forensic].map(v=>`<div class="item">${esc(v)} <span class="badge">회신 대기 · 데모</span></div>`).join('')||'<p class="muted">의뢰한 항목 없음</p>'}<div class="notice">수사분 12분은 형사의 행동 예산이지, DNA 감정이 12분에 끝난다는 뜻이 아닙니다.</div></div></div><div style="margin-top:16px">${btn('수사본부로','hub','primary')}</div>`;}
function records(){return `${top('공식 기록 요청')}<h1>확인되지 않은 사실을 요청으로 검증</h1><div class="panel"><p>대상별 출처·법적 절차·수사 비용을 표시합니다. 실제 자료 생성/조회는 이 HTML 시안에 구현되어 있지 않습니다.</p><div class="btnrow">${btn('CCTV 원본 요청 · 6분','request:CCTV')}${btn('통화 자료 절차 · 8분','request:COMM')}${btn('금융 자료 절차 · 8분','request:FIN')}</div><p class="muted">카메라의 화각 밖을 촬영했다고 처리하면 안 됩니다. 미공개 계좌·폰 데이터가 인물 AI에게 누출되지 않게 해야 합니다.</p></div><div style="margin-top:15px">${btn('수사본부로','hub')}</div>`;}
function board(){return `${top('사건 수첩 / 자유 추리 보드')}<div class="grid"><div class="panel"><h3>현장에서 관찰한 물품</h3>${[...state.seen].map(id=>`<div class="item">${esc(facts.find(x=>x[1]===id)?.[0]||id)} <span class="badge">${state.photos.has(id)?'사진 기록':'관찰'}</span></div>`).join('')||'<p class="muted">아직 직접 관찰한 물품 없음</p>'}<h3 style="margin-top:24px">면담 상태</h3><p>${[...state.interviews].map(esc).join(' / ')||'아직 없음'}</p></div><div class="panel"><h3>형사의 가설</h3><p class="muted">당신의 추측은 정본과 구별되어 저장됩니다. 무료로 수정 가능.</p><textarea id="note" style="width:100%;height:180px;background:#101820;color:#fff;padding:13px;border:1px solid #52616c" placeholder="현장·진술·반증을 직접 연결하세요.">${esc(state.note)}</textarea><div style="margin-top:10px">${btn('가설 저장 · 비용 0','saveNote','primary')}</div></div></div><div style="margin-top:16px">${btn('수사본부로','hub')}</div>`;}
function report(){return `${top('최종 수사보고서 · 초안은 언제든 수정 가능')}<div class="proof"><div class="panel"><h3>사건 피의자 가설</h3><label><input type="radio" name="accused" value="강도현"> 강도현</label><label><input type="radio" name="accused" value="이서연"> 이서연</label><label><input type="radio" name="accused" value="박현수"> 박현수</label><label><input type="radio" name="accused" value="지목 보류"> 지목 보류</label></div><div class="panel"><h3>증거를 연결할 네 축</h3>${[['1','접근 및 시간'],['2','동기와 관계'],['3','치명상과 행위'],['4','다른 두 사람의 대안 검토']].map(([n,k])=>`<div class="proofrow"><h3>${n}. ${k}</h3><input type="text" placeholder="주장 + 해당 증거ID + 반박되는 설명" /></div>`).join('')}<div class="notice">실제 게임은 사건별 입증 판정 엔진이 증거 원본·독립출처·반증을 검증합니다. 이 페이지는 배치 시안이며 성공 판정 엔진이 없습니다.</div>${btn('제출 화면 흐름 확인','submit','primary')}</div><div class="panel"><h3>현재 수사 상태</h3><div class="item">현장 관찰 ${state.seen.size}</div><div class="item">확보 사진 ${state.photos.size}</div><div class="item">면담 인물 ${state.interviews.size}</div><p class="muted">그냥 이름을 클릭해도 성공은 불가능. 각 사건에 정해진 독립 입증 조건과 면담 사실이 필요합니다.</p>${btn('초안 닫기','hub')}</div></div>`;}
function ending(){return `${top('엔딩 연출 / 결과 화면 설계')}<div class="panel stage" style="text-align:center"><div class="micro">CASE 001 / 수사 종결 화면 시안</div><h1>진술은 남는다. 증거도 남는다.</h1><p>실제 게임은 보고서의 근거로 결과를 평가합니다.</p><p class="muted">이 HTML 시안에는 정답 판정이 없어 결과를 임의로 표시하지 않습니다.<br>가능한 결과: 입증 성공 / 이름만 맞힘 / 오인 지목 / 절차 문제 / 판단 보류</p><div class="btnrow" style="justify-content:center">${btn('수사본부로 돌아가기','hub','primary')}${btn('메인 메뉴','menu')}</div></div>`;}
function render(){B.textContent=state.budget;clock.textContent=state.screen==='menu'?'':`CASE 001 · ${state.screen.toUpperCase()}`; A.innerHTML=({menu,case:caseSelect,brief:briefing,cinematic,scene,hub,roster,interview:interrogation,forensic,records,board,report,ending})[state.screen]?.()||menu();}
document.addEventListener('click',ev=>{let b=ev.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;if(a==='case'||a==='menu'||a==='brief'||a==='cinematic'||a==='scene'||a==='hub'||a==='roster'||a==='forensic'||a==='records'||a==='board'||a==='report'||a==='ending'){go(a);return;}if(a==='archive'||a==='settings'||a==='quit'){message('실제 설정·기록·종료 기능은 Unity 제작 시 구현. 현재는 UX 화면 시안입니다.');return;}if(a==='hubfromscene'){if(spend(5,'302호에서 수사본부로 이동'))go('hub');return;}if(a==='revisit'){if(spend(5,'302호 현장 재방문'))go('scene');return;}if(a.startsWith('inspect:')){let f=facts[Number(a.split(':')[1])];state.seen.add(f[1]);if(confirm(`${f[0]} (${f[1]})\n${f[2]}\n\n관찰은 무료입니다. 사진을 남기면 수사분 1분입니다.\n사진 기록하시겠습니까?`)){if(!state.photos.has(f[1])&&spend(1,`${f[0]} 사진 기록`))state.photos.add(f[1]);else if(state.photos.has(f[1]))message('이미 기록한 사진입니다. 중복 차감하지 않습니다.');}render();return;}if(a.startsWith('call:')){let s=a.split(':')[1];if(spend(6,`${s} 조사실 호출`)){state.suspect=s;state.interviews.add(s);state.messages=[];state.questionCount=0;state.tactic='normal';go('interview');}return;}if(a.startsWith('tactic:')){state.tactic=a.split(':')[1];render();return;}if(a==='mic'){message('마이크 입력 UI 시안입니다. 실제 STT·마이크 녹음은 연결되어 있지 않습니다.');return;}if(a==='ask'){let q=document.querySelector('#question')?.value.trim();if(!q){message('질문을 먼저 입력하세요.');return;}let costs={normal:2,evidence:3,silence:4,pressure:6,desk:12};let c=costs[state.tactic];if(spend(c,`${state.suspect}에게 ${state.tactic} 전술로 질문`)){state.questionCount++;state.messages.push({by:'형사',text:q},{by:state.suspect,text:'무슨 말씀인지 알겠습니다. 다만 지금 질문하신 내용은 제가 확인하고 답해야 할 부분이 있습니다. (UI 시안용 임시 문장 — AI 연결 없음)'});render();}return;}if(a.startsWith('lab:')){let id=a.split(':')[1];if(state.forensic.has(id)){message('이미 신청한 동일 검사입니다. 중복 비용 없음.');return;}if(spend(12,`${id} 포렌식 예비 검사 의뢰`)){state.forensic.add(id);render();}return;}if(a.startsWith('request:')){let id=a.split(':')[1];if(state.claimed.has(id)){message('같은 요청을 반복해도 자동 추가 비용 없음.');return;}let c=id==='CCTV'?6:8;if(spend(c,`${id} 자료 요청`)){state.claimed.add(id);message(`${id}: 의뢰 접수 시안. 실제 회신/적법성 검증은 미연결.`);}return;}if(a==='saveNote'){state.note=document.querySelector('#note').value;message('현재 시안 세션에서 가설을 갱신했습니다. 비용 0.');return;}if(a==='submit'){if(confirm('정식 제출은 사건당 1회입니다. 이 HTML은 판정 기능이 없으므로 화면 흐름만 시연합니다. 계속하시겠습니까?'))go('ending');return;}});
document.querySelector('#toMenu').addEventListener('click',()=>go('menu'));render();
</script></body></html>
